name: bloom_gad_app
description: BLOOM - CvSU GADRC Mobile & Web Application

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.1
  flutter_animate: ^4.3.0

  # Supabase — auth, database, storage, realtime
  supabase_flutter: ^2.5.6

  # Environment variables — keeps Supabase keys out of source code
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env
